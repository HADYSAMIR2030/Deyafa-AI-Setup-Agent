name: Windows V1 build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build src/DeyafaSetupAgent/DeyafaSetupAgent.csproj -c Release
      - name: Publish
        run: dotnet publish src/DeyafaSetupAgent/DeyafaSetupAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: DeyafaSetupAgent-V1-win-x64
          path: publish/
